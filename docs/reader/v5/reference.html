<title>Wingman Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">

<style>
/* ===========================================================================
   Wingman Reader v4
   Logo pinned top-left · movable tool rail · panel always opposite ·
   filled coloured tool icons · note & question widgets
   =========================================================================== */
.rdr{
  --lv:#4C8DF6;
  --ink-0:#080C11; --ink-1:#0E141B;
  --chrome:rgba(24,31,40,.82); --chrome-2:rgba(32,40,50,.95);
  --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.055);
  --lift:rgba(255,255,255,.07);
  --fill:rgba(255,255,255,.075); --fill-2:rgba(255,255,255,.13);
  --txt:#EAF0F6; --txt-2:#97A6B4; --txt-3:#63717E;
  --accent:var(--lv); --accent-soft:color-mix(in srgb,var(--lv) 18%,transparent);
  --sh:0 14px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.34);
  --sh-pop:0 26px 68px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);
  --sh-page:0 1px 3px rgba(0,0,0,.4),0 20px 54px rgba(0,0,0,.44);
  --hl-y:#F5C23C; --hl-b:#5BB4F0; --hl-g:#43C08A; --hl-p:#B571E0; --hl-r:#EE6F82;
  --ease:cubic-bezier(.32,.72,0,1);
  --r:16px; --r-sm:11px; --r-xs:9px;
  position:fixed;inset:0;overflow:hidden;color:var(--txt);
  font:15px/1.5 "Instrument Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none;
  background:
    radial-gradient(1150px 640px at 80% -10%,color-mix(in srgb,var(--lv) 15%,transparent),transparent 62%),
    radial-gradient(880px 520px at 4% 104%,color-mix(in srgb,var(--lv) 8%,transparent),transparent 60%),
    linear-gradient(180deg,var(--ink-1),var(--ink-0));
  transition:background .55s var(--ease);
}
.rdr[data-look="light"]{
  --chrome:rgba(255,255,255,.85); --chrome-2:rgba(255,255,255,.97);
  --hair:rgba(16,26,38,.11); --hair-2:rgba(16,26,38,.06); --lift:rgba(255,255,255,.9);
  --fill:rgba(16,26,38,.055); --fill-2:rgba(16,26,38,.1);
  --txt:#101923; --txt-2:#5A6875; --txt-3:#95A2AE;
  --accent-soft:color-mix(in srgb,var(--lv) 13%,transparent);
  --sh:0 12px 34px rgba(18,30,44,.16),0 1px 2px rgba(18,30,44,.1);
  --sh-pop:0 22px 56px rgba(18,30,44,.2),0 2px 6px rgba(18,30,44,.12);
  --sh-page:0 1px 3px rgba(18,30,44,.14),0 16px 40px rgba(18,30,44,.15);
  background:
    radial-gradient(1100px 600px at 82% -10%,color-mix(in srgb,var(--lv) 20%,transparent),transparent 60%),
    radial-gradient(820px 480px at 2% 104%,color-mix(in srgb,var(--lv) 11%,transparent),transparent 58%),
    linear-gradient(180deg,#DEE4EA,#CDD6DF);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#06090D;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0;resize:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ── document ───────────────────────────────────────────────────────── */
.stage{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:74px 0 62px}
.stage::-webkit-scrollbar{width:0}
.stack{display:flex;flex-direction:column;align-items:center;gap:22px;padding:0 26px}
.page{width:min(870px,100%);background:#fff;color:#161a1f;border-radius:3px;
  box-shadow:var(--sh-page);transform:scale(var(--z,1));transform-origin:top center;
  transition:transform .36s var(--ease);padding:52px 60px 68px;position:relative}
.page.ph{min-height:540px;display:grid;place-items:center;padding:0;
  background:linear-gradient(180deg,#fbfbfc,#f2f3f5)}
.page.ph span{font-size:12px;color:#adb2b9;letter-spacing:.05em}
.pnum{position:absolute;left:-40px;top:3px;font-size:11px;color:var(--txt-3)}
.doch{border-bottom:1px solid #e4e5e8;padding-bottom:12px;margin-bottom:22px;
  display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.doch h1{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.doch .rt{font-size:11.5px;color:#8a9098;text-align:right;white-space:nowrap;line-height:1.45}
.page h2{font-size:13.5px;font-weight:650;margin:0 0 10px}
.page p{font-size:15.5px;line-height:1.62;margin-bottom:11px;max-width:60ch;color:#22262c}
.figure{height:140px;border:1px solid #e6e7ea;border-radius:4px;margin:16px 0 20px;
  display:grid;place-items:center;color:#b4b9c0;font-size:12px;
  background:repeating-linear-gradient(45deg,#fcfcfd,#fcfcfd 10px,#f6f7f9 10px,#f6f7f9 20px)}
.pfoot{margin-top:26px;padding-top:10px;border-top:1px solid #eceded;
  display:flex;justify-content:space-between;font-size:11px;color:#a5aab1}
.s{border-radius:2px;padding:1px 2px;margin:0 -2px;transition:background .15s}
.rdr[data-mark="1"] .s:hover{background:rgba(0,0,0,.055);cursor:text}
.s.m{background:var(--mk);box-shadow:0 0 0 1px var(--mkb);animation:ink .32s var(--ease)}
@keyframes ink{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.s.sel{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-soft)}
.rdr[data-tool="sel"] .s.m{cursor:pointer}

/* ── chrome ─────────────────────────────────────────────────────────── */
.chrome{position:absolute;z-index:30;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.rdr[data-chrome="off"] .chrome{opacity:0;pointer-events:none}
.glass{background:var(--chrome);backdrop-filter:blur(28px) saturate(1.6);
  -webkit-backdrop-filter:blur(28px) saturate(1.6);border:1px solid var(--hair);
  box-shadow:var(--sh),inset 0 1px 0 var(--lift);border-radius:var(--r)}
.pop{background:var(--chrome-2);box-shadow:var(--sh-pop),inset 0 1px 0 var(--lift)}
.ic{width:32px;height:32px;border-radius:var(--r-xs);display:grid;place-items:center;
  color:var(--txt-2);flex:0 0 auto;position:relative;
  transition:background .15s,color .15s,transform .15s var(--ease)}
.ic:hover{background:var(--fill);color:var(--txt)}
.ic:active{transform:scale(.92)}
.ic.on{background:var(--accent-soft);color:var(--accent)}
.ic .badge{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;
  background:var(--hl-y);box-shadow:0 0 0 2px var(--chrome)}
.div{width:1px;height:19px;background:var(--hair);margin:0 5px;flex:0 0 auto}
.rdr[data-ctx="me"] .courseonly{display:none}

/* ── logo: pinned, never fades ──────────────────────────────────────── */
.logo{position:absolute;left:18px;top:16px;z-index:38;display:flex;align-items:center;gap:9px;
  padding:7px 13px 7px 9px;border-radius:var(--r-sm);
  transition:background .16s,transform .16s var(--ease),padding .34s var(--ease)}
.logo:hover{background:var(--fill)}
.logo:active{transform:scale(.97)}
.logo svg{color:var(--lv);flex:0 0 auto}
.logo b{font-size:15px;font-weight:700;letter-spacing:-.025em;
  max-width:110px;overflow:hidden;white-space:nowrap;
  transition:max-width .4s var(--ease),opacity .3s var(--ease)}
.rdr[data-chrome="off"] .logo b{max-width:0;opacity:0}
.rdr[data-chrome="off"] .logo{padding-right:9px}

/* doc name floats centre-top */
.docbar{top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;
  gap:2px;padding:5px 7px;max-width:min(620px,calc(100% - 420px))}
.doc{display:flex;flex-direction:column;gap:1px;padding:3px 11px;border-radius:var(--r-xs);
  min-width:0;text-align:left;transition:background .15s}
.doc:hover{background:var(--fill)}
.doc b{font-size:13px;font-weight:550;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;display:block;max-width:250px}
.doc em{font-style:normal;font-size:10px;color:var(--txt-3);letter-spacing:.07em;
  text-transform:uppercase;font-weight:500}

/* actions top-right */
.acts{top:16px;right:18px;display:flex;align-items:center;gap:2px;padding:5px 7px}

/* corners */
.corner-ul{left:18px;bottom:22px;display:flex;align-items:center;gap:2px;padding:5px 6px}
.corner-z{right:18px;bottom:22px;display:flex;align-items:center;gap:2px;padding:5px 6px}
.corner-z .v{font-size:11.5px;color:var(--txt-2);min-width:62px;text-align:center}

/* ── tool rail — four positions ─────────────────────────────────────── */
.tools{display:flex;padding:6px;gap:3px;z-index:33}
.rdr[data-bar="left"]  .tools{left:18px;top:50%;transform:translateY(-50%);flex-direction:column}
.rdr[data-bar="right"] .tools{right:18px;top:50%;transform:translateY(-50%);flex-direction:column}
.rdr[data-bar="bottom"].tools,.rdr[data-bar="bottom"] .tools{left:50%;bottom:22px;transform:translateX(-50%);flex-direction:row}
.rdr[data-bar="top"] .tools{left:50%;top:74px;transform:translateX(-50%);flex-direction:row}
.rdr[data-chrome="off"][data-bar="left"] .tools{transform:translateY(-50%) translateX(-12px)}
.rdr[data-chrome="off"][data-bar="right"] .tools{transform:translateY(-50%) translateX(12px)}
.rdr[data-chrome="off"][data-bar="bottom"] .tools{transform:translateX(-50%) translateY(12px)}
.rdr[data-chrome="off"][data-bar="top"] .tools{transform:translateX(-50%) translateY(-12px)}

.t{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;
  position:relative;flex:0 0 auto;transition:background .16s,transform .18s var(--ease)}
.t:hover{background:var(--fill)}
.t.on{background:var(--fill-2);box-shadow:inset 0 1px 0 var(--lift)}
.t.on::after{content:"";position:absolute;border-radius:2px;background:var(--accent)}
.rdr[data-bar="left"] .t.on::after{left:-7px;top:50%;transform:translateY(-50%);width:3px;height:16px}
.rdr[data-bar="right"] .t.on::after{right:-7px;top:50%;transform:translateY(-50%);width:3px;height:16px}
.rdr[data-bar="bottom"] .t.on::after{top:-7px;left:50%;transform:translateX(-50%);width:16px;height:3px}
.rdr[data-bar="top"] .t.on::after{bottom:-7px;left:50%;transform:translateX(-50%);width:16px;height:3px}
.t .cnt{position:absolute;top:2px;right:4px;font-size:8.5px;line-height:1;color:var(--txt-3);font-weight:500}
.t .x{position:absolute;top:-4px;left:-4px;width:16px;height:16px;border-radius:50%;
  background:var(--hl-r);color:#33101a;display:none;place-items:center;font-size:11px;line-height:1;z-index:3}
.rdr[data-edit="1"] .t .x{display:grid}
.rdr[data-edit="1"] .t.lock .x{display:none}
.railsep{background:var(--hair);flex:0 0 auto;border-radius:2px}
.rdr[data-bar="left"] .railsep,.rdr[data-bar="right"] .railsep{height:1px;width:26px;margin:4px auto}
.rdr[data-bar="bottom"] .railsep,.rdr[data-bar="top"] .railsep{width:1px;height:26px;margin:auto 4px}
.chest,.addb,.collapse{width:38px;height:38px;border-radius:var(--r-sm);display:grid;
  place-items:center;color:var(--txt-3);flex:0 0 auto;transition:.16s}
.chest:hover,.addb:hover,.collapse:hover{color:var(--txt);background:var(--fill)}
.chest.on{color:var(--accent);background:var(--accent-soft)}

.tip{position:absolute;background:var(--chrome-2);border:1px solid var(--hair);padding:5px 9px;
  border-radius:8px;font-size:11.5px;white-space:nowrap;box-shadow:var(--sh);opacity:0;
  pointer-events:none;backdrop-filter:blur(20px);z-index:60;
  transition:opacity .14s,transform .18s var(--ease)}
.rdr[data-bar="left"] .tip{left:48px;top:50%;transform:translateY(-50%) translateX(-4px)}
.rdr[data-bar="left"] :hover>.tip{transform:translateY(-50%)}
.rdr[data-bar="right"] .tip{right:48px;top:50%;transform:translateY(-50%) translateX(4px)}
.rdr[data-bar="right"] :hover>.tip{transform:translateY(-50%)}
.rdr[data-bar="bottom"] .tip{bottom:48px;left:50%;transform:translateX(-50%) translateY(4px)}
.rdr[data-bar="bottom"] :hover>.tip{transform:translateX(-50%)}
.rdr[data-bar="top"] .tip{top:48px;left:50%;transform:translateX(-50%) translateY(-4px)}
.rdr[data-bar="top"] :hover>.tip{transform:translateX(-50%)}
.t:hover .tip,.chest:hover .tip,.addb:hover .tip,.collapse:hover .tip{opacity:1}
.tip kbd{font-size:10px;color:var(--txt-3);margin-left:6px}

/* ── properties ─────────────────────────────────────────────────────── */
.props{width:278px;z-index:34;opacity:0;pointer-events:none;overflow:hidden;
  transition:opacity .2s,transform .26s var(--ease)}
.rdr[data-bar="left"] .props{left:70px;top:50%;transform:translateY(-50%) translateX(-6px) scale(.98)}
.rdr[data-bar="left"] .props.open{transform:translateY(-50%) scale(1)}
.rdr[data-bar="right"] .props{right:70px;top:50%;transform:translateY(-50%) translateX(6px) scale(.98)}
.rdr[data-bar="right"] .props.open{transform:translateY(-50%) scale(1)}
.rdr[data-bar="bottom"] .props{left:50%;bottom:76px;transform:translateX(-50%) translateY(6px) scale(.98)}
.rdr[data-bar="bottom"] .props.open{transform:translateX(-50%) scale(1)}
.rdr[data-bar="top"] .props{left:50%;top:128px;transform:translateX(-50%) translateY(-6px) scale(.98)}
.rdr[data-bar="top"] .props.open{transform:translateX(-50%) scale(1)}
.props.open{opacity:1;pointer-events:auto}
.props .hd{padding:12px 14px 10px;font-size:13px;font-weight:600;
  border-bottom:1px solid var(--hair-2);display:flex;align-items:center;gap:8px}
.props .hd .ic{width:26px;height:26px;margin-left:auto}
.props .bd{padding:14px}
.prev{height:48px;border-radius:var(--r-sm);background:var(--fill);display:grid;place-items:center;
  margin-bottom:15px;overflow:hidden;border:1px solid var(--hair-2)}
.prev .smp{font-size:15px;padding:2px 8px;border-radius:2px;color:var(--txt)}
.rw{margin-bottom:15px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lbl span{font-size:10.5px;color:var(--txt-3);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.lbl b{font-size:11px;font-weight:500;padding:3px 8px;border-radius:7px;background:var(--fill);
  border:1px solid var(--hair-2);min-width:44px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;
  background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--trk,var(--fill-2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
  background:#fff;margin-top:-6.5px;box-shadow:0 1px 4px rgba(0,0,0,.45);transition:transform .15s var(--ease)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.13)}
.ticks{display:flex;justify-content:space-between;margin-top:1px;padding:0 2px}
.ticks b{font-size:9px;font-weight:400;color:var(--txt-3)}
.recent{display:flex;align-items:center;gap:8px;margin-bottom:11px;padding-bottom:11px;
  border-bottom:1px dashed var(--hair-2)}
.recent .rl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3);font-weight:500}
.cols{display:flex;align-items:center;gap:9px}
.c{width:26px;height:26px;border-radius:50%;position:relative;flex:0 0 auto;transition:transform .18s var(--ease)}
.c:hover{transform:scale(1.11)}
.c i{position:absolute;inset:0;border-radius:50%;background:var(--k);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.c.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--k)}
.c.sm{width:21px;height:21px}
.mean{display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding:10px 11px;
  border-radius:var(--r-sm);background:var(--fill);border:1px solid var(--hair-2)}
.mean i{width:8px;height:8px;border-radius:2px;background:var(--k);flex:0 0 auto;margin-top:4px}
.mean b{display:block;font-size:12.5px;font-weight:600}
.mean u{display:block;text-decoration:none;font-size:11px;line-height:1.42;color:var(--txt-3);margin-top:3px}
.rdr[data-ctx="me"] .mean{display:none}

/* ── add-tool sheet ─────────────────────────────────────────────────── */
.addsheet{width:322px;z-index:35;opacity:0;pointer-events:none;overflow:hidden;
  transition:opacity .2s,transform .26s var(--ease)}
.rdr[data-bar="left"] .addsheet{left:70px;top:50%;transform:translateY(-50%) translateX(-6px) scale(.98)}
.rdr[data-bar="left"] .addsheet.open{transform:translateY(-50%) scale(1)}
.rdr[data-bar="right"] .addsheet{right:70px;top:50%;transform:translateY(-50%) translateX(6px) scale(.98)}
.rdr[data-bar="right"] .addsheet.open{transform:translateY(-50%) scale(1)}
.rdr[data-bar="bottom"] .addsheet{left:50%;bottom:76px;transform:translateX(-50%) translateY(6px) scale(.98)}
.rdr[data-bar="bottom"] .addsheet.open{transform:translateX(-50%) scale(1)}
.rdr[data-bar="top"] .addsheet{left:50%;top:128px;transform:translateX(-50%) translateY(-6px) scale(.98)}
.rdr[data-bar="top"] .addsheet.open{transform:translateX(-50%) scale(1)}
.addsheet.open{opacity:1;pointer-events:auto}
.addsheet .hd{padding:12px 14px 10px;font-size:13px;font-weight:600;display:flex;align-items:center}
.tabs{display:flex;gap:14px;padding:0 14px;border-bottom:1px solid var(--hair-2);overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tabs button{padding:0 0 9px;font-size:12px;color:var(--txt-3);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:13px}
.cell{border-radius:var(--r-sm);padding:11px 3px 9px;display:grid;justify-items:center;gap:7px;
  text-align:center;transition:background .15s,transform .18s var(--ease)}
.cell:hover{background:var(--fill);transform:translateY(-1px)}
.cell span{font-size:10px;line-height:1.2;color:var(--txt-2)}
.cell .b{width:34px;height:34px;border-radius:10px;background:var(--fill);display:grid;place-items:center}
.cell.have{opacity:.34;pointer-events:none}
.foot{padding:0 14px 12px;font-size:10.5px;color:var(--txt-3);display:flex;gap:8px}
.foot u{text-decoration:none;color:var(--accent);margin-left:auto;cursor:pointer}
.posrow{display:flex;gap:4px;padding:0 14px 13px}
.posrow button{flex:1;padding:7px 0;border-radius:var(--r-xs);font-size:11px;color:var(--txt-3);
  background:var(--fill);transition:.15s}
.posrow button.on{background:var(--accent-soft);color:var(--accent)}

/* ── note & question widgets ────────────────────────────────────────── */
.note{position:absolute;z-index:6;width:250px;border-radius:12px;overflow:hidden;
  background:var(--nb);border:1px solid var(--nk);
  box-shadow:0 8px 24px rgba(20,25,35,.22),0 1px 2px rgba(20,25,35,.16);
  transition:box-shadow .2s,transform .22s var(--ease)}
.note.drag{box-shadow:0 20px 44px rgba(20,25,35,.34);cursor:grabbing;transition:none}
.note .nh{display:flex;align-items:center;gap:7px;padding:8px 9px 7px;cursor:grab;
  background:var(--nk);color:#1b1f26}
.note .nh svg{flex:0 0 auto;opacity:.72}
.note .nh input{flex:1;font-size:12.5px;font-weight:650;letter-spacing:-.01em;color:#161a20;min-width:0}
.note .nh input::placeholder{color:rgba(20,24,30,.42)}
.note .nh button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  color:rgba(20,24,30,.6);flex:0 0 auto}
.note .nh button:hover{background:rgba(255,255,255,.35);color:#111}
.note .nb{padding:9px 10px 10px}
.note .nb textarea{width:100%;min-height:56px;font-size:12.5px;line-height:1.5;color:#2a2f36}
.note .nb textarea::placeholder{color:#9aa1a9}
.note .nf{display:flex;align-items:center;gap:6px;padding:0 9px 9px}
.note .nf .c{width:17px;height:17px}
.note .nf .c.on::after{inset:-3px}
.note .nf .who{margin-left:auto;font-size:10px;color:#8b929a}
.pin{position:absolute;z-index:6;display:flex;align-items:center;gap:6px;max-width:190px;
  padding:5px 10px 5px 7px;border-radius:20px;background:var(--nk);color:#1b1f26;cursor:grab;
  box-shadow:0 3px 10px rgba(20,25,35,.2);font-size:11.5px;font-weight:600;letter-spacing:-.01em;
  transition:transform .18s var(--ease),box-shadow .18s}
.pin:hover{transform:scale(1.04);box-shadow:0 6px 16px rgba(20,25,35,.28)}
.pin span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pin svg{flex:0 0 auto;opacity:.75}

/* ── panel + rail, always opposite the bar ──────────────────────────── */
.rail{top:74px;bottom:70px;width:16px;z-index:28;cursor:pointer}

   case 'pen': return g(`<g ${rot}><path d="M8.2 3.2h5.6v7.9H8.2z" fill="${c}"/>

     <path d="M7.4 14.6c.8 1.4 2.2 2.1 3.9 2.1 2.2 0 3.8-1.1 3.8-2.7" stroke="${c}" stroke-width="2" fill="none" stroke-linecap="round"/>

     <rect x="6.4" y="7" width="9.2" height="1.5" rx=".7" fill="${D}"/><rect x="6.4" y="10" width="6" height="1.5" rx=".7" fill="${D}"/>`);

const PAGES=[
 {n:129,h:'Autorotation',b:[
  {t:'p',s:['In powered flight the engine supplies the torque that overcomes rotor drag and holds the rotor at its governed speed.',
            'If the engine fails, or a drive shaft shears, another force has to keep the rotor turning if the aircraft is to reach the ground under control.']},
  {t:'p',s:['During descent, air flows upward through the main rotor disc instead of downward.',
            'That airflow drives the blades and replaces the lost engine torque.',
            'The pilot sets this force with collective pitch.']},
  {t:'f',x:'Figure 63 — Ground effect'},
  {t:'p',s:['Held correctly, the aircraft is in autorotative flight, the first phase of an autorotation.',
            'As height is traded away, potential energy is converted into rotational energy and stored in the turning rotor.']},
  {t:'p',s:['Close to the ground the pilot spends that stored energy to cushion the touchdown, which is the second phase.',
            'Rotor RPM must stay inside limits throughout: too low and the blades stall, too high and they are overspeeded beyond structural limits.']}]},
 {n:130,h:'Ground effect',b:[
  {t:'p',s:['Ground effect is the increase in rotor efficiency that occurs when the aircraft hovers within roughly one rotor diameter of the surface.',
            'The downwash cannot escape freely, so induced flow through the disc is reduced and less power is needed for a given lift.']},
  {t:'p',s:['In ground effect the induced angle of attack falls and the lift vector tilts less rearward, which reduces induced drag.',
            'Out of ground effect the same hover demands noticeably more torque.',
            'A surface that is not firm, such as long grass or loose snow, weakens the effect because the downwash is absorbed rather than reflected.']},
  {t:'p',s:['Performance charts are published separately for in-ground-effect and out-of-ground-effect hover, and the two must never be read interchangeably.']}]},
 {n:131,h:'Rotor RPM limits',b:[
  {t:'p',s:['Rotor speed is shown on a dual tachometer carrying engine and rotor RPM on one dial face.',
            'Needle split is the first indication of a drive disconnection.']},
  {t:'p',s:['The green arc marks the normal operating range, the red radial the never-exceed value, and the lower yellow band the caution region entered during autorotation.',
            'Recovery from low rotor RPM is by lowering collective immediately; nose attitude alone will not restore it.']}]}];

const FAR=[
 {p:34,k:'b',me:1,ago:'last week',t:'Blade element theory divides the blade into small spanwise sections.'},

const tools=$('#tools');
function paintTools(){

  S.tray.forEach(id=>{const t=T(id);if(!t||(t.course&&!isC()))return;

    out+=`<button class="t ${id===S.tool?'on':''} ${t.lock?'lock':''}" data-t="${id}" aria-label="${t.n}">
      ${icon(id,c)}${t.p?`<span class="cnt">${t.p}</span>`:''}

}
function toggleSheet(){const on=!sheet.classList.contains('open');

function paintProps(){
  const t=T(S.tool);if(!t)return;

    <div style="font-size:12px;color:var(--txt-3);line-height:1.5">${
      t.id==='sel'?'Click any mark, note or question to pick it up.':
      t.id==='era'?'Erases a whole stroke at a time. Text marks are left alone.':
      'Tap the page to place it.'}</div></div>`;return}
  const fixed=!!t.fixed;
  const c=col(fixed?t.fixed:(S.colour[t.id]||'y')),sz=S.size[t.id],op=S.opacity[t.id];
  const ink=(t.id==='pen'||t.id==='mkr');

function addMark(id,kk){if(S.marks.some(m=>m.id===id))return;
  const k=kk||S.colour[S.tool]||'y';
  S.marks.push({id,p:TX[id]?.p??S.page,k,me:1,ago:'just now'});
  U.push({t:'add',id});Rd.length=0;paintPage();paintList()}
function delMark(id){const i=S.marks.findIndex(m=>m.id===id);if(i<0)return;
  U.push({t:'del',m:S.marks[i]});Rd.length=0;S.marks.splice(i,1);
  if(S.sel===id)pick(null);paintPage();paintList()}
function recol(id,k){const m=S.marks.find(x=>x.id===id);if(!m)return;
  U.push({t:'col',id,k:m.k});Rd.length=0;m.k=k;paintPage();paintList();buildCard()}
function undo(re){const a=(re?Rd:U).pop();if(!a)return;
  if(a.t==='add'){const i=S.marks.findIndex(m=>m.id===a.id);if(i>=0){(re?U:Rd).push({t:'radd',m:S.marks[i]});S.marks.splice(i,1)}}
  else if(a.t==='del'){S.marks.push(a.m);(re?U:Rd).push({t:'rdel',id:a.m.id})}
  else if(a.t==='col'){const m=S.marks.find(x=>x.id===a.id);if(m){(re?U:Rd).push({t:'col',id:a.id,k:m.k});m.k=a.k}}
  else if(a.t==='radd'){S.marks.push(a.m);(re?U:Rd).push({t:'add',id:a.m.id})}
  else if(a.t==='rdel'){const i=S.marks.findIndex(m=>m.id===a.id);if(i>=0){(re?U:Rd).push({t:'del',m:S.marks[i]});S.marks.splice(i,1)}}
  else if(a.t==='note'){S.notes=S.notes.filter(n=>n.id!==a.id);(re?U:Rd).push({t:'rnote',n:a.n})}
  else if(a.t==='rnote'){S.notes.push(a.n);(re?U:Rd).push({t:'note',id:a.n.id,n:a.n})}
  pick(null);paintPage();paintList()}

        return `<div class="th ${p===S.page?'on':''}" data-p="${p}" ${has?`style="--k:${col(has.k).hex}"`:''}>
          ${has?'<span class="dot"></span>':''}
          <i class="h"></i>${Array.from({length:7},(_,j)=>`<i style="width:${[100,92,97,74,100,88,58][j]}%"></i>`).join('')}
          <b>${p}</b></div>`}).join('')+`</div>`;
    b.querySelectorAll('.th').forEach(t=>t.addEventListener('click',()=>{setPage(+t.dataset.p);paintList()}));
    return}
  if(S.ptab==='search'){
    b.innerHTML=`<div class="srch"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="9" r="5"/><path d="M12.8 12.8L17 17" stroke-linecap="round"/></svg>
      <input placeholder="Search this paper, or the module"></div>
      <div class="blank"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="17" cy="17" r="10"/><path d="M24.5 24.5L33 33" stroke-linecap="round"/></svg>
      Search finds text, your notes and<br>anyone's marks across the module.</div>`;return}
  if(S.ptab==='outline'){
    b.innerHTML=`<div class="gh">Contents</div>`+PAGES.map(p=>
      `<div class="row" data-p="${p.n}" style="--k:var(--txt-3)"><div class="bar"></div>
        <div><div class="t2"><b style="color:var(--txt)">${p.h}</b><em>p.${p.n}</em></div>
        <div class="meta">Built from the paper's own headings</div></div></div>`).join('');
    b.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{
      PG(+r.dataset.p)?.scrollIntoView({behavior:'smooth',block:'start'});setPage(+r.dataset.p)}));
    return}
  if(S.ptab==='queue'){
    b.innerHTML=`<div class="blank"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="19" cy="19" r="13"/><path d="M19 11v8l5 3"/></svg>
      Nothing reported on this paper yet.<br>Flags from students land here.</div>`;return}
  /* marks */
  const rows=all().filter(m=>S.filter==='all'||m.k===S.filter);
  let out=`<div class="filters">${[{k:'all',n:'Everything'},...COL.map(c=>({k:c.k,n:isC()?c.course:c.name}))]
    .map(f=>`<button class="f ${f.k===S.filter?'on':''}" data-k="${f.k}">${f.n}</button>`).join('')}</div>`;
  if(!rows.length){b.innerHTML=out+`<div class="blank">Nothing matches.</div>`;wireF();return}
  let last=null;
  rows.forEach(m=>{const c=col(m.k);
    if(m.p!==last){last=m.p;out+=`<div class="gh">Page ${m.p}</div>`}
    out+=`<div class="row" data-id="${m.id||''}" data-p="${m.p}" style="--k:${c.hex}">
      <div class="bar"></div><div><div class="t2">
        <b>${m.note?(m.kind==='question'?'Question':'Note'):(isC()?c.course:c.name)}</b><em>p.${m.p}</em></div>
      <p>${m.t||'—'}</p>
      <div class="meta">${m.me?'You':m.anon?'Anonymous':(WHO[m.who]?.n||'Someone')} · ${m.ago}</div></div></div>`});
  b.innerHTML=out;wireF();
  b.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{
    if(!S.pinned)closeP();
    jump(+r.dataset.p,()=>{
      const el=r.dataset.id&&SP(r.dataset.id);
      if(el){el.scrollIntoView({block:'center',behavior:'smooth'});
        setTimeout(()=>{S.tool='sel';paintTools();pick(r.dataset.id)},300)}
      else{const n=S.notes.find(x=>x.id===r.dataset.id);
        if(n){PG(n.p)?.scrollIntoView({behavior:'smooth',block:'center'});n.open=1;paintNotes()}}})}));
}
function wireF(){$('#pbody').querySelectorAll('.f').forEach(f=>f.addEventListener('click',()=>{
  S.filter=f.dataset.k;paintList();save()}))}
function openP(){panel.classList.add('open');hold(true)}
function closeP(){if(S.pinned)return;panel.classList.remove('open');hold(false)}
$('#bPanel').addEventListener('click',()=>{
  if(panel.classList.contains('open')&&!S.pinned){panel.classList.remove('open');hold(false)}
  else{openP()}});
let hoverT;
$('#rail').addEventListener('mouseenter',()=>{clearTimeout(hoverT);
  hoverT=setTimeout(openP,180)});
$('#rail').addEventListener('mouseleave',()=>{clearTimeout(hoverT);
  hoverT=setTimeout(()=>{if(!panel.matches(':hover'))closeP()},320)});
panel.addEventListener('mouseenter',()=>clearTimeout(hoverT));
panel.addEventListener('mouseleave',()=>{hoverT=setTimeout(closeP,320)});

/* ── rail ──────────────────────────────────────────────────────────── */
const rail=$('#rail'),rtip=$('#railtip');
function paintRail(){rail.querySelectorAll('.tk').forEach(t=>t.remove());
  const H=rail.clientHeight;
  all().forEach(m=>{const c=col(m.k),d=document.createElement('div');
    d.className='tk'+(m.me||m.here?' mine':'');
    d.style.cssText=`top:${(m.p/TOTAL)*H}px;--k:${c.hex}`;d.dataset.p=m.p;d.dataset.k=m.k;
    rail.appendChild(d)});
  $('#now').style.top=((S.page/TOTAL)*H)+'px'}
rail.addEventListener('mousemove',e=>{const t=e.target.closest('.tk');
  if(!t){rtip.classList.remove('on');return}
  const c=col(t.dataset.k);rtip.style.setProperty('--k',c.hex);
  rtip.innerHTML=`<b>${isC()?c.course:c.name}</b><em>p.${t.dataset.p}</em>`;
  rtip.style.top=(t.getBoundingClientRect().top+2)+'px';rtip.classList.add('on')});
rail.addEventListener('mouseleave',()=>rtip.classList.remove('on'));
rail.addEventListener('click',e=>{const t=e.target.closest('.tk');if(t)setPage(+t.dataset.p)});

/* ── scrubber, zoom, refresh ───────────────────────────────────────── */
const scrub=$('#scrub');
function setPage(p){S.page=Math.max(1,Math.min(TOTAL,Math.round(p)));
  const f=S.page/TOTAL;
  $('#sfill').style.width=(f*100)+'%';$('#sknob').style.left=(f*100)+'%';
  const n=all().filter(m=>Math.abs(m.p-S.page)<=4).length;
  $('#sread').innerHTML=`${S.page}<em>of ${TOTAL}${n?` · ${n} near`:''}</em>`;
  $('#sread').style.left=(f*100)+'%';
  if(scard.classList.contains('open'))paintCard();
  $('#now').style.top=((S.page/TOTAL)*rail.clientHeight)+'px';save()}
let sd=false;
scrub.addEventListener('pointerdown',e=>{sd=true;scrub.setPointerCapture(e.pointerId);
  scrub.classList.add('live');scard.classList.add('open');hold(true);
  setPage((e.clientX/innerWidth)*TOTAL);paintCard()});
scrub.addEventListener('pointermove',e=>{if(sd){setPage((e.clientX/innerWidth)*TOTAL);paintCard()}});
['pointerup','pointercancel'].forEach(v=>scrub.addEventListener(v,()=>{
  if(!sd)return;sd=false;scrub.classList.remove('live');
  setTimeout(()=>scard.classList.remove('open'),240);hold(false)}));
scrub.addEventListener('mouseenter',()=>scrub.classList.add('live'));
scrub.addEventListener('mouseleave',()=>{if(!sd)scrub.classList.remove('live')});
$('#stage').addEventListener('scroll',()=>{const mid=innerHeight/2;
  $$('.page[data-p]').forEach(p=>{const r=p.getBoundingClientRect();
    if(r.top<mid&&r.bottom>mid)setPage(+p.dataset.p)});
  if(S.sel)place()},{passive:true});
const Z=[{v:.82,l:'Fit page'},{v:1,l:'Fit width'},{v:1.2,l:'120%'},{v:1.45,l:'145%'},{v:1.75,l:'175%'}];
function paintZoom(){$$('.page').forEach(p=>p.style.setProperty('--z',Z[S.zi].v));
  $('#zVal').textContent=Z[S.zi].l;pick(null);save()}
$('#zIn').addEventListener('click',()=>{S.zi=Math.min(Z.length-1,S.zi+1);paintZoom()});
$('#zOut').addEventListener('click',()=>{S.zi=Math.max(0,S.zi-1);paintZoom()});
const IN=[{id:'129-2-1',p:129,k:'y',who:'ds',ago:'just now',agree:2},
          {id:'130-2-0',p:130,k:'b',who:'ka',ago:'just now'}];
$('#bSync').addEventListener('click',()=>{
  $('#syncI').animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],
    {duration:760,iterations:2,easing:'cubic-bezier(.5,0,.5,1)'});
  setTimeout(()=>{const add=IN.filter(m=>!S.marks.some(x=>x.id===m.id));
    if(!add.length)return toast('Up to date');
    add.forEach(m=>S.marks.push({...m}));$('#syncB').hidden=false;paintPage();paintList();
    toast(`${add.length} new marks from the module`)},860)});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('open');
  clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('open'),3200)}
$('#bLook').addEventListener('click',()=>{S.look=S.look==='dark'?'light':'dark';R.dataset.look=S.look;save()});
$('#logo').addEventListener('click',()=>toast('Flight Deck'));

addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo(e.shiftKey?1:0);return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){pick(null);props.classList.remove('open');sheet.classList.remove('open');
    S.pinned=false;paintTabs();panel.classList.remove('open');R.dataset.edit='0';held=0;wake();return}
  if(/^[1-5]$/.test(e.key)){const k=COL[+e.key-1].k;
    if(S.sel)recol(S.sel,k);else if(T(S.tool)?.c)useCol(k);return}
  const t=TOOLS.find(x=>x.k.toLowerCase()===e.key.toLowerCase());
  if(t&&S.tray.includes(t.id)){S.tool=t.id;paintTools();paintProps();save()}});

$$('.demo [data-ctx]').forEach(b=>b.addEventListener('click',()=>{
  S.ctx=b.dataset.ctx;R.dataset.ctx=S.ctx;
  $$('.demo [data-ctx]').forEach(x=>x.classList.toggle('on',x===b));
  $('#docName').textContent=isC()?'Rotary Wing Aerodynamics':'Autorotation notes.pdf';
  $('#docSub').textContent=isC()?'Module 13 · M13.01':'My documents';
  if(!isC()){S.marks=S.marks.filter(m=>m.me);S.notes=S.notes.filter(n=>n.kind!=='question')}
  if(S.ptab==='queue')S.ptab='marks';
  S.filter='all';paintTools();paintProps();paintTabs();paintPage();paintList();save()}));

/* ── platform ──────────────────────────────────────────────────────── */
function plat(){
  const coarse=matchMedia('(pointer:coarse)').matches||!matchMedia('(hover:hover)').matches;
  const w=innerWidth;
  const p = w<680 ? 'phone' : (coarse||w<1100) ? 'tablet' : 'desktop';
  if(R.dataset.plat!==p){
    R.dataset.plat=p;
    if(p==='phone'&&S.bar!=='bottom'){R.dataset.bar='bottom'}else{R.dataset.bar=S.bar}
    paintTools();
  }
  return p}
addEventListener('resize',()=>{plat();paintRail();if(S.sel)place()});
const touch=()=>R.dataset.plat!=='desktop';

/* ── selection popover ─────────────────────────────────────────────── */
const selpop=$('#selpop');
function hideSel(){selpop.classList.remove('open');selpop._r=null}
function showSel(){
  const s=getSelection();
  if(!s||s.isCollapsed||!s.rangeCount)return hideSel();
  const r=s.getRangeAt(0);
  if(!r.commonAncestorContainer.parentElement?.closest('.page'))return hideSel();
  const txt=s.toString().trim();if(txt.length<3)return hideSel();
  const sp=r.startContainer.parentElement?.closest('.s');
  selpop._r={id:sp?.dataset.id,txt};
  selpop.innerHTML=`<div class="swatches">${COL.map(c=>
      `<button class="c" data-k="${c.k}" style="--k:${c.hex}" aria-label="${c.name}"><i></i></button>`).join('')}</div>
    <span class="div"></span>
    <button data-a="note">${icon('note',null,15)} Note</button>
    ${isC()?`<button data-a="ask">${icon('ask','#B571E0',15)} Ask</button>`:''}
    <button data-a="copy">Copy</button>`;
  const b=r.getBoundingClientRect();
  selpop.classList.add('open');
  const w=selpop.offsetWidth||300;
  if(R.dataset.plat!=='phone'){
    selpop.style.left=Math.max(14,Math.min(innerWidth-w-14,b.left+b.width/2-w/2))+'px';
    selpop.style.top=Math.max(70,b.top-48)+'px';
  }
  hold(true);
}
document.addEventListener('mouseup',e=>{if(e.target.closest('.selpop'))return;setTimeout(showSel,10)});
document.addEventListener('selectionchange',()=>{const s=getSelection();
  if((!s||s.isCollapsed)&&selpop.classList.contains('open')){hideSel();hold(false)}});
selpop.addEventListener('click',e=>{
  const c=e.target.closest('.c'),a=e.target.closest('[data-a]')?.dataset.a,d=selpop._r;
  if(!d)return;
  if(c&&d.id){addMark(d.id,c.dataset.k);}
  else if(a==='note'||a==='ask'){
    const pgn=TX[d.id]?.p??S.page,pg=PG(pgn);
    if(pg){const n={id:'n'+Date.now(),p:pgn,x:.70,y:.10,
        k:a==='ask'?'p':(S.colour.note||'y'),kind:a==='ask'?'question':'note',
        title:'',body:'',open:1,anon:a==='ask'?1:0,
        exc:[{t:d.txt.length>150?d.txt.slice(0,150)+'…':d.txt,p:pgn}]};
      S.notes.push(n);U.push({t:'note',id:n.id,n});paintNotes();paintList();save();
      setTimeout(()=>document.querySelector(`.note[data-id="${n.id}"] [data-title]`)?.focus(),40)}}
  getSelection().removeAllRanges();hideSel();hold(false)});

/* ── drag a mark into a note → it becomes a quoted excerpt ─────────── */
let ex=null;
$('#stack').addEventListener('pointerdown',e=>{
  if(S.tool!=='sel')return;
  const s=e.target.closest('.s.m');if(!s)return;
  ex={s,x:e.clientX,y:e.clientY,live:0}});
addEventListener('pointermove',e=>{
  if(!ex)return;
  if(!ex.live&&Math.hypot(e.clientX-ex.x,e.clientY-ex.y)<8)return;
  if(!ex.live){ex.live=1;clearTimeout(hv);pick(null);
    ex.g=document.createElement('div');ex.g.className='ghost';
    ex.g.textContent='“'+ex.s.textContent.slice(0,60)+'…”';document.body.appendChild(ex.g)}
  ex.g.style.left=(e.clientX+14)+'px';ex.g.style.top=(e.clientY+14)+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const tgt=el&&el.closest('.note,.pin');
  $$('.note,.pin').forEach(n=>n.classList.toggle('drop',n===tgt))});
addEventListener('pointerup',e=>{
  if(!ex)return;
  if(ex.live){
    ex.g.remove();
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tgt=el&&el.closest('.note,.pin');
    if(tgt){const n=S.notes.find(x=>x.id===tgt.dataset.id);
      if(n){n.exc=n.exc||[];n.exc.push({t:ex.s.textContent,p:TX[ex.s.dataset.id]?.p??S.page});
        n.open=1;paintNotes();paintList();save();toast('Added to the note')}}
    $$('.note,.pin').forEach(n=>n.classList.remove('drop'))}
  ex=null});
$('#stack').addEventListener('click',e=>{
  const b=e.target.closest('[data-xrm]');if(!b)return;
  const el=b.closest('.note'),n=S.notes.find(x=>x.id===el.dataset.id);
  if(n&&n.exc){n.exc.splice(+b.dataset.xrm,1);paintNotes();save()}});

/* ── scrubber card + back pill ─────────────────────────────────────── */
const scard=$('#scard'),backp=$('#backp');
function paintCard(){
  const near=all().filter(m=>Math.abs(m.p-S.page)<=4);
  const c=near[0]?col(near[0].k).hex:null;
  scard.innerHTML=`<div class="th2">${Array.from({length:8},(_,i)=>
    `<i class="${i===0?'h':''} ${near.length&&i===4?'m':''}" style="${i?`width:${[0,96,88,99,70,100,84,54][i]}%`:''}${near.length&&i===4&&c?`;background:${c}`:''}"></i>`).join('')}</div>
    <div class="mt"><b>${S.page}</b><span>of ${TOTAL}</span>
    ${near.length?`<u style="${c?`color:${c}`:''}">${near.length} mark${near.length>1?'s':''} near here</u>`:''}</div>`;
  scard.style.left=((S.page/TOTAL)*100)+'%'}
let ret=null;
function jump(p,fn){ret={y:$('#stage').scrollTop,page:S.page};
  $('#backT').textContent='Back to page '+ret.page;backp.classList.add('open');hold(true);
  fn&&fn();setPage(p)}
backp.addEventListener('click',()=>{if(!ret)return;
  $('#stage').scrollTo({top:ret.y,behavior:'smooth'});setPage(ret.page);
  backp.classList.remove('open');hold(false);ret=null});

/* ── marks-only view ───────────────────────────────────────────────── */
function buildRev(){
  const rows=all();
  $('#revSub').textContent=`${rows.length} passages across ${new Set(rows.map(r=>r.p)).size} pages.`;
  $('#revF').innerHTML=`<button class="f ${!S.revF||S.revF==='all'?'on':''}" data-k="all">Everything</button>`+
    COL.map(c=>{const n=rows.filter(r=>r.k===c.k).length;
      return `<button class="f ${S.revF===c.k?'on':''}" data-k="${c.k}">${isC()?c.course:c.name}
        <span style="color:${c.hex};margin-left:4px">${n}</span></button>`}).join('');
  const f=(S.revF&&S.revF!=='all')?rows.filter(r=>r.k===S.revF):rows;
  const gr={};f.forEach(r=>{(gr[r.k]=gr[r.k]||[]).push(r)});
  $('#revB').innerHTML=Object.keys(gr).map(k=>{const c=col(k);
    return `<div class="rgrp"><div class="rgh" style="--k:${c.hex}"><i></i>
      <b>${isC()?c.course:c.name}</b><em>${gr[k].length} passages</em></div>
      ${gr[k].sort((a,b)=>a.p-b.p).map(m=>`<div class="rcard" data-id="${m.id||''}" data-p="${m.p}" style="--k:${c.hex}">
        <div class="st"></div><p>${m.t||'—'}</p><span class="pg">p.${m.p}</span></div>`).join('')}</div>`}).join('')
    ||`<div class="blank" style="padding:70px 0">Nothing marked in that colour yet.</div>`}
$('#revF').addEventListener('click',e=>{const b=e.target.closest('.f');if(b){S.revF=b.dataset.k;buildRev()}});
$('#revB').addEventListener('click',e=>{const c=e.target.closest('.rcard');if(!c)return;
  R.dataset.mode='read';$('#bRev').classList.remove('on');
  jump(+c.dataset.p,()=>{const el=c.dataset.id&&SP(c.dataset.id);
    if(el){el.scrollIntoView({block:'center',behavior:'smooth'});
      setTimeout(()=>{S.tool='sel';paintTools();pick(c.dataset.id)},300)}})});
$('#bRev').addEventListener('click',e=>{const on=R.dataset.mode!=='rev';
  R.dataset.mode=on?'rev':'read';e.currentTarget.classList.toggle('on',on);
  if(on){buildRev();pick(null);hold(true)}else hold(false)});
$('#revX').addEventListener('click',()=>{R.dataset.mode='read';$('#bRev').classList.remove('on');hold(false)});

/* ── first-run coach ───────────────────────────────────────────────── */
function coach(){
  if(S.coached)return;
  const spots=[
   {t:'Your tools',d:'Tap the chest to add any tool. Long-press the bar to rearrange it.',x:'86px',y:'50%'},
   {t:'Everything you marked',d:'Hover this edge and your marks slide open, with the page they are on.',x:null,r:'46px',y:'34%'},
   {t:'Fly through the manual',d:'Drag along the bottom edge to move through 1,012 pages.',x:'50%',y:null,b:'70px',c:1}];
  spots.forEach((s,i)=>{const d=document.createElement('div');
    d.className='glass pop coach';d.style.animationDelay=(i*.5+.6)+'s';
    if(s.x)d.style.left=s.x;if(s.r)d.style.right=s.r;
    if(s.y)d.style.top=s.y;if(s.b)d.style.bottom=s.b;
    if(s.c)d.style.transform='translateX(-50%)';
    d.innerHTML=`<b>${s.t}</b>${s.d}${i===2?'<br><button>Got it</button>':''}`;
    R.appendChild(d)});
  R.querySelectorAll('.coach button').forEach(b=>b.addEventListener('click',()=>{
    R.querySelectorAll('.coach').forEach(c=>c.remove());S.coached=1;save()}));
  setTimeout(()=>{R.querySelectorAll('.coach').forEach(c=>c.remove());S.coached=1;save()},14000)}

/* boot */
R.dataset.look=S.look;R.dataset.ctx=S.ctx;R.dataset.bar=S.bar;R.dataset.side=S.side;
plat();
$$('.demo [data-ctx]').forEach(x=>x.classList.toggle('on',x.dataset.ctx===S.ctx));
$('#docName').textContent=isC()?'Rotary Wing Aerodynamics':'Autorotation notes.pdf';
$('#docSub').textContent=isC()?'Module 13 · M13.01':'My documents';
paintTools();paintProps();paintTabs();paintPage();paintList();paintZoom();
requestAnimationFrame(()=>{paintRail();setPage(S.page)});
if(S.pinned)openP();
wake();coach();
if(resumed&&S.coached)setTimeout(()=>toast(`Back on page ${S.page}`),600);
})();
</script>
