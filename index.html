<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wingman — Aircraft Maintenance Study</title>
    <meta name="description" content="We made the mistakes. You get the answers. Lessons, quizzes and papers for aircraft maintenance students." />

    <link rel="canonical" href="https://www.wingman.institute/" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230B1526'/%3E%3Cpath fill='%236FA0F0' d='M12 2 L14 8 L23 17 L14 15 L17 22 L12 19 L7 22 L10 15 L1 17 L10 8 Z'/%3E%3C/svg%3E" />

    <!-- Static, not set from React: link-preview bots fetch index.html and do
         not run the bundle, so anything injected at runtime never reaches them. -->
    <meta property="og:site_name" content="Wingman" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.wingman.institute/" />
    <meta property="og:title" content="Wingman — Never fly alone" />
    <meta property="og:description" content="Every hour we wasted is an hour you won't." />
    <meta property="og:image" content="https://www.wingman.institute/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Wingman wordmark on a deep blue night sky." />

    <!-- No twitter:title or twitter:description on purpose. They fall back to
         the og: pair so there is one source of truth. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The Sky blue livery ground, both brightnesses. Derived from
         deckVars("sky", …).vars["--ground"] in src/lib/liveryEngine.js:
         night oklch(0.1400 0.0161 255.00), day oklch(.966 .010 85). Written as
         hex because theme-color predates oklch() in most mobile browsers. -->
    <meta name="theme-color" content="#050910" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Wingman",
        "url": "https://www.wingman.institute/",
        "applicationCategory": "EducationalApplication",
        "description": "We made the mistakes. You get the answers. Lessons, quizzes and papers for aircraft maintenance students."
      }
    </script>
  </head>
  <body style="margin:0; background:#0B1526;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
